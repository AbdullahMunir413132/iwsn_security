# IWSN Security - Grafana Real-Time Monitoring Stack
# Usage:
#   cd visualization/grafana
#   docker-compose up -d
#   Open http://localhost:3000 (admin/iwsn_security)

services:
  # InfluxDB - Time-series database for metrics storage
  influxdb:
    image: influxdb:2.7
    container_name: iwsn_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=iwsn_security_2026
      - DOCKER_INFLUXDB_INIT_ORG=iwsn
      - DOCKER_INFLUXDB_INIT_BUCKET=iwsn_metrics
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=iwsn-security-influxdb-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - iwsn_network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:10.4.0
    container_name: iwsn_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=iwsn_security
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/iwsn_realtime_dashboard.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./dashboards:/var/lib/grafana/dashboards
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - iwsn_network

volumes:
  influxdb_data:
  grafana_data:

networks:
  iwsn_network:
    driver: bridge
