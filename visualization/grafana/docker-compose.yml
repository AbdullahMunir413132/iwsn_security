version: '3.8'

# IWSN Security — Grafana + Prometheus Stack for Raspberry Pi
# Real-time visualization of DPI, IDS, MQTT metrics and sensor data
#
# Usage:
#   cd visualization/grafana && docker-compose up -d
#
# Then run the exporter after each analysis:
#   python3 ../../visualization/grafana_exporter.py --report-dir /path/to/reports
#
# Access:
#   Grafana:    http://localhost:3000 (admin / iwsn_security)
#   Prometheus: http://localhost:9090

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: iwsn_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:v1.7.0
    container_name: iwsn_node_exporter
    ports:
      - "9100:9100"
    volumes:
      - /tmp:/host/textfile:ro
    command:
      - '--collector.textfile.directory=/host/textfile'
      - '--collector.textfile'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: iwsn_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=iwsn_security
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/iwsn_dashboard.json
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
